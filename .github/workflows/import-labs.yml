name: Import recovered networking lab sources
on:
  push:
    paths:
      - 'import-payload/labs.tar.xz.b64'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'SantinoBianco/RedesYSistemasDistribuidos-2025'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore all four laboratory directories
        run: |
          set -euo pipefail
          test -f import-payload/labs.tar.xz.b64
          base64 -d import-payload/labs.tar.xz.b64 | tar -tJf - >/dev/null
          git rm -f --cached -- redes25lab1g35 redes25lab2g35 redes25lab3g35 redes25lab4g35
          rm -rf redes25lab1g35 redes25lab2g35 redes25lab3g35 redes25lab4g35
          base64 -d import-payload/labs.tar.xz.b64 | tar -xJf -
          git add -- redes25lab1g35 redes25lab2g35 redes25lab3g35 redes25lab4g35
          git rm -- import-payload/labs.tar.xz.b64 .github/workflows/import-labs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "feat: publish code and reports for four networking labs"
          git push origin HEAD:main
