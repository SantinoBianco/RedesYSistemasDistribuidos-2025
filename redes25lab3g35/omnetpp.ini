[General]
network = Network
sim-time-limit = 200s

# --- Generador de paquetes ---
Network.nodeTx.gen.generationInterval = exponential(0.1)
Network.nodeTx.gen.packetByteSize = 12500

# --- Tamaño de buffers ---
Network.nodeTx.traTx.bufferSize = 1000000
Network.nodeTx.traTx.windowSize = 200

Network.queue0.bufferSize = 200
Network.queue1.bufferSize = 200

Network.nodeRx.traRx.bufferSize = 200


cmdenv-express-mode = false
**.sink.delayVector.vector-recording = true
**.sink.packetsReceivedVector.vector-recording = true
*.sink.recordVectors = true

# --- NOTA ---
# El datarate está especificado en las conexiones del .ned,
# así que no hace falta definirlo como parámetro aquí.
# Para cambiar entre caso de estudio 1 y 2, simplemente:
# - comentá/descomentá las líneas correspondientes en network.ned